schema_version: "1.0"

extension:
  id: improve
  name: "Improve Extension"
  version: "2.0.0"
  description: "Audits any codebase as a senior advisor and writes prioritized, self-contained spec prompts under specs/improves/ that the spec-kit lifecycle can process."
  author: d0whc3r
  repository: https://github.com/d0whc3r/spec-kit-improve
  homepage: https://d0whc3r.github.io/spec-kit-improve/
  license: MIT
  category: process
  effect: read-write

requires:
  speckit_version: ">=0.12.17"

provides:
  commands:
    - name: speckit.improve.run
      file: commands/speckit.improve.run.md
      description: "Audit any codebase as a senior advisor and write self-contained spec prompts under specs/improves/ for the spec-kit lifecycle to process: surface prioritized findings with evidence, write a single prompt for a specific change, or re-run to refresh prompts whose code has drifted"

tags:
  - advisor
  - audit
  - code-quality
  - code-review
  - performance
  - planning
  - refactoring
  - security
  - tech-debt
  - testing
